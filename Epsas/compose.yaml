services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: epsas-app:local
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - epsas_storage:/var/www/html/storage
      - epsas_public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - epsas_public:/var/www/html/public:ro
      - epsas_storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  worker:
    image: epsas-app:local
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=120", "--max-time=3600"]
    volumes:
      - epsas_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: epsas-app:local
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - epsas_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: epsas
      POSTGRES_USER: epsas
      POSTGRES_PASSWORD: change-this-local-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epsas -d epsas"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  epsas_storage:
  epsas_public:
  redis_data:
  postgres_data:
