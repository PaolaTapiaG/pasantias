ServerRoot "C:/xampp/apache"
Listen 127.0.0.1:8080
ServerName 127.0.0.1:8080
PidFile "C:/Practicas/Epsas/storage/logs/apache-staging.pid"

LoadModule access_compat_module modules/mod_access_compat.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule remoteip_module modules/mod_remoteip.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so

LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libpq.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"

PHPIniDir "C:/Practicas/Epsas/storage/staging-php"

ThreadsPerChild 256
MaxConnectionsPerChild 0
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 1
AcceptFilter http none
EnableSendfile Off
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1

DocumentRoot "C:/Practicas/Epsas/public"
DirectoryIndex index.php
TypesConfig conf/mime.types

<Directory "C:/Practicas/Epsas/public">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

SetEnv APP_ENV production
SetEnv APP_DEBUG false
SetEnv APP_URL http://127.0.0.1:8080
SetEnv APP_CONFIG_CACHE bootstrap/cache/config-staging.php
SetEnv APP_ROUTES_CACHE bootstrap/cache/routes-staging.php
SetEnv LOG_LEVEL warning
SetEnv REDIS_CLIENT predis
SetEnv REDIS_HOST 127.0.0.1
SetEnv REDIS_PORT 6379
SetEnv REDIS_PERSISTENT true
SetEnv SESSION_DRIVER redis
SetEnv SESSION_CONNECTION session
SetEnv QUEUE_CONNECTION redis
SetEnv CACHE_STORE redis

ErrorLog "C:/Practicas/Epsas/storage/logs/apache-staging-error.log"
LogLevel warn
